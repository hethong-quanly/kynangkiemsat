<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1e5a8a" />
  <title>Ngoại tuyến — Kỹ năng Kiểm sát</title>
  <style>
    :root { --sky-dark:#1e5a8a; --plum-dark:#5a1f30; --bronze:#c9952e; --bg:#eef7f9; --ink:#1e293b; --muted:#64748b; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; font-family: "Be Vietnam Pro", Arial, sans-serif;
      background: var(--bg); color: var(--ink);
      display: flex; align-items: center; justify-content: center; padding: 24px;
    }
    .card {
      width: min(440px, 100%); background: #fff; border: 1px solid rgba(203,213,225,.6);
      border-radius: 20px; padding: 28px 24px; text-align: center;
      box-shadow: 0 8px 28px -8px rgba(30,90,138,.18);
    }
    .mark {
      width: 72px; height: 72px; border-radius: 18px; margin: 0 auto 16px;
      background: var(--sky-dark); overflow: hidden;
    }
    .mark img { width: 100%; height: 100%; object-fit: cover; }
    h1 { margin: 0 0 8px; font-size: 20px; font-weight: 800; }
    p { margin: 0 0 18px; font-size: 14px; line-height: 1.55; color: var(--muted); }
    a {
      display: inline-flex; align-items: center; justify-content: center;
      min-height: 44px; padding: 0 18px; border-radius: 12px;
      background: linear-gradient(135deg, var(--sky-dark), var(--plum-dark));
      color: #fff; text-decoration: none; font-weight: 700; font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark"><img src="apple-touch-icon.png" alt="" /></div>
    <h1>Chưa có mạng</h1>
    <p>Trang này chưa được tải sẵn. Mở app một lần khi có mạng để lưu công cụ HTML (tính hạn, THADS, THAHS, KN-TC). Công cụ Udify và NotebookLM luôn cần mạng.</p>
    <a href="./?vao=1">Về danh mục</a>
  </div>
</body>
</html>
