[package]
name = "kynangkiemsat"
version = "1.0.0"
description = "Kỹ năng Kiểm sát — ứng dụng máy tính (Windows)"
authors = ["Thiên Phúc"]
edition = "2021"
publish = false

[lib]
name = "kynangkiemsat_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
url = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
