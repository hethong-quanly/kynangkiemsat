.item:last-child { border-bottom:0; }

 x\xE9t vi\u1EC7c kh\xE1ng ngh\u1ECB theo th\u1EE7 t\u1EE5c ph\xFAc th\u1EA9m, gi\xE1m \u0111\u1ED1c th\u1EA9m, t\xE1i th\u1EA9m.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">1.2. Y\xEAu c\u1EA7u gi\u1EEF b\xED m\u1EADt trong ho\u1EA1t \u0111\u1ED9ng x\xE1c minh, \u0111\u1EA3m b\u1EA3o t\xEDnh kh\xE1ch quan, hi\u1EC7u qu\u1EA3.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">2. N\u1ED8I DUNG X\xC1C MINH</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- L\xE0m vi\u1EC7c v\u1EDBi ai, t\u1EA1i \u0111\u1ECBa \u0111i\u1EC3m n\xE0o, l\xE0m r\xF5 nh\u1EEFng v\u1EA5n \u0111\u1EC1 g\xEC?</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">+ V\u1EA5n \u0111\u1EC1 th\u1EE9 nh\u1EA5t;</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">+ V\u1EA5n \u0111\u1EC1 th\u1EE9 hai \u2026.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- L\xE0m r\xF5 t\xECnh ti\u1EBFt c\xF2n m\xE2u thu\u1EABn (c\xF2n thi\u1EBFu) trong v\u1EE5 \xE1n ch\u01B0a \u0111\u01B0\u1EE3c x\xE1c minh l\xE0m r\xF5 trong qu\xE1 tr\xECnh \u0111i\u1EC1u tra, truy t\u1ED1, x\xE9t x\u1EED </p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">+ C\xE1c v\u1EA5n \u0111\u1EC1 m\xE2u thu\u1EABn trong l\u1EDDi khai gi\u1EEFa b\u1ECB can, b\u1ECB c\xE1o v\xE0 nh\u1EEFng ng\u01B0\u1EDDi tham gia t\u1ED1 t\u1EE5ng; gi\u1EEFa nh\u1EEFng b\u1ECB can, b\u1ECB c\xE1o v\u1EDBi nhau; gi\u1EEFa nh\u1EEFng ng\u01B0\u1EDDi tham gia t\u1ED1 t\u1EE5ng v\u1EDBi nhau\u2026</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">+ C\xE1c v\u1EA5n \u0111\u1EC1 ch\u01B0a \u0111\u01B0\u1EE3c l\xE0m r\xF5 trong v\u1EE5 \xE1n</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;"> &nbsp;&nbsp;&nbsp;&nbsp;- L\xE0m r\xF5 nh\u1EEFng ch\u1EE9ng c\u1EE9 bu\u1ED9c t\u1ED9i, ch\u1EE9ng c\u1EE9 x\xE1c minh b\u1ECB can, b\u1ECB c\xE1o kh\xF4ng c\xF3 t\u1ED9i; c\xE1c t\xECnh ti\u1EBFt t\u0103ng n\u1EB7ng, gi\u1EA3m nh\u1EB9\u2026 c\u1EE7a b\u1ECB can, b\u1ECB c\xE1o.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">&nbsp;&nbsp;&nbsp;&nbsp;- L\xE0m r\xF5 c\xE1c v\u1EA5n \u0111\u1EC1 ch\u01B0a \u0111\u01B0\u1EE3c gi\u1EA3i quy\u1EBFt v\u1EC1 x\u1EED l\xFD v\u1EADt ch\u1EE9ng, tr\xE1ch nhi\u1EC7m d\xE2n s\u1EF1, bi\u1EC7n ph\xE1p t\u01B0 ph\xE1p, bi\u1EC7n ph\xE1p ng\u0103n ch\u1EB7n, bi\u1EC7n ph\xE1p c\u01B0\u1EE1ng ch\u1EBF v\xE0 c\xE1c v\u1EA5n \u0111\u1EC1 kh\xE1c trong v\u1EE5 \xE1n.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;"> &nbsp;&nbsp;&nbsp;&nbsp;- L\xE0m r\xF5 c\xE1c vi ph\u1EA1m trong ho\u1EA1t \u0111\u1ED9ng t\u1ED1 t\u1EE5ng, h\xE0nh vi c\u1EE7a ng\u01B0\u1EDDi c\xF3 th\u1EA9m quy\u1EC1n ti\u1EBFn h\xE0nh t\u1ED1 t\u1EE5ng trong qu\xE1 tr\xECnh \u0111i\u1EC1u tra, truy t\u1ED1, x\xE9t x\u1EED v\u1EE5 \xE1n\u2026</p><br/><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">&nbsp;&nbsp;&nbsp;&nbsp;N\u01A1i nh\u1EADn:                                                              \u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">- L\u01B0u: HSKS.                                                             (K\xFD, ghi r\xF5 h\u1ECD t\xEAn, \u0111\xF3ng d\u1EA5u)</p><br/><br/><br/><br/><br/><br/></div>`

2026\u2026\u2026\u2026</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">&nbsp;&nbsp;&nbsp;&nbsp; </p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">T\xF4i l\xE0\u2026\u2026\u2026; \u0111\u01B0\u1EE3c ph\xE2n c\xF4ng th\u1EF1c h\xE0nh quy\u1EC1n c\xF4ng t\u1ED1, ki\u1EC3m s\xE1t x\xE9t x\u1EED s\u01A1 th\u1EA9m v\u1EE5 \xE1n6\u2026\u2026 c\xF3 b\u1ECB c\xE1o (c\xE1c b\u1ECB c\xE1o) ph\u1EA1m t\u1ED9i (ho\u1EB7c c\xE1c t\u1ED9i) \u2026\u2026\u2026\u2026</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">Sau khi nghi\xEAn c\u1EE9u v\u1EE5 \xE1n, t\xF4i b\xE1o c\xE1o v\xE0 \u0111\u1EC1 xu\u1EA5t quan \u0111i\u1EC3m gi\u1EA3i quy\u1EBFt v\u1EE5 \xE1n nh\u01B0 sau:</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">I. T\xD3M T\u1EAET N\u1ED8I DUNG V\u1EE4 \xC1N</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">N\xEAu kh\xE1i qu\xE1t n\u1ED9i dung v\u1EE5 \xE1n, h\xE0nh vi, ch\u1EE9ng c\u1EE9 bu\u1ED9c t\u1ED9i, g\u1EE1 t\u1ED9i, \u0111\u1ED9ng c\u01A1 m\u1EE5c \u0111\xEDch, h\u1EADu qu\u1EA3 do h\xE0nh vi ph\u1EA1m t\u1ED9i b\u1ECB can/b\u1ECB c\xE1o (c\xE1c b\u1ECB can/b\u1ECB c\xE1o) g\xE2y ra.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">II. QU\xC1 TR\xCCNH T\u1ED0 T\u1EE4NG C\u1EE6A V\u1EE4 \xC1N</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">Ph\u1EA7n n\xE0y c\u1EA7n n\xEAu: </p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">1. Qu\xE1 tr\xECnh t\u1ED1 t\u1EE5ng c\u1EE7a v\u1EE5 \xE1n theo tr\xECnh t\u1EF1 th\u1EDDi gian t\u1EEB khi s\u1EF1 ki\u1EC7n ph\u1EA1m t\u1ED9i x\u1EA3y ra, kh\u1EDFi t\u1ED1 v\u1EE5 \xE1n, kh\u1EDFi t\u1ED1 b\u1ECB can (ho\u1EB7c c\xE1c b\u1ECB can) \u2026 \u0111\u1EBFn khi k\u1EBFt th\xFAc \u0111i\u1EC1u tra, Vi\u1EC7n ki\u1EC3m s\xE1t ban h\xE0nh C\xE1o tr\u1EA1ng (ho\u1EB7c Quy\u1EBFt \u0111\u1ECBnh truy t\u1ED1) truy t\u1ED1 b\u1ECB can (ho\u1EB7c c\xE1c b\u1ECB can).</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">N\xEAu th\xEAm c\xE1c h\xE0nh vi, quy\u1EBFt \u0111\u1ECBnh t\u1ED1 t\u1EE5ng giai \u0111o\u1EA1n sau khi ban h\xE0nh C\xE1o tr\u1EA1ng \u0111\u1EBFn khi chu\u1EA9n b\u1ECB x\xE9t x\u1EED (b\u1ED5 sung: nh\u1EEFng t\xECnh ti\u1EBFt, ch\u1EE9ng c\u1EE9, t\xE0i li\u1EC7u\u2026. m\u1EDBi, ph\xE1t sinh trong giai \u0111o\u1EA1n chu\u1EA9n b\u1ECB x\xE9t x\u1EED).</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">2. \xDD ki\u1EBFn c\u1EE7a Vi\u1EC7n ki\u1EC3m s\xE1t c\u1EA5p tr\xEAn; \xFD ki\u1EBFn c\u1EE7a c\xE1c c\u1EA5p, c\xE1c ng\xE0nh, c\u1EA5p \u1EE7y \u0111\u1ECBa ph\u01B0\u01A1ng, d\u01B0 lu\u1EADn x\xE3 h\u1ED9i v\xE0 c\u01A1 quan ng\xF4n lu\u1EADn (n\u1EBFu c\xF3) trong qu\xE1 tr\xECnh gi\u1EA3i quy\u1EBFt v\u1EE5 \xE1n.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">III. NH\u1EACN X\xC9T, \u0110\u1EC0 XU\u1EA4T C\u1EE6A KI\u1EC2M S\xC1T VI\xCAN \u0110\u01AF\u1EE2C PH\xC2N C\xD4NG TH\u1EF0C H\xC0NH QUY\u1EC0N C\xD4NG T\u1ED0, KI\u1EC2M S\xC1T X\xC9T X\u1EEC V\u1EE4 \xC1N</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">1. Nh\u1EADn x\xE9t</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">a) Nh\u1EADn x\xE9t \u0111\u1EA7y \u0111\u1EE7, to\xE0n di\u1EC7n c\xE1c ch\u1EE9ng c\u1EE9 bu\u1ED9c t\u1ED9i, c\xE1c ch\u1EE9ng c\u1EE9 g\u1EE1 t\u1ED9i \u0111\u1ED1i v\u1EDBi b\u1ECB can/b\u1ECB c\xE1o (c\xE1c b\u1ECB can/b\u1ECB c\xE1o); \u0111\xE1nh gi\xE1 v\u1EC1 t\xEDnh h\u1EE3p ph\xE1p, kh\xE1ch quan, li\xEAn quan c\u1EE7a ch\u1EE9ng c\u1EE9; nh\u1EADn x\xE9t, \u0111\xE1nh gi\xE1 v\u1EC1 s\u1EF1 m\xE2u thu\u1EABn gi\u1EEFa c\xE1c ch\u1EE9ng c\u1EE9 trong h\u1ED3 s\u01A1 v\u1EE5 \xE1n (n\u1EBFu c\xF3).</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">b) Nh\u1EEFng vi ph\u1EA1m c\u1EE7a c\xE1c c\u01A1 quan t\u01B0 ph\xE1p, c\u01A1 quan b\u1ED5 tr\u1EE3 t\u01B0 ph\xE1p, ng\u01B0\u1EDDi c\xF3 th\u1EA9m quy\u1EC1n ti\u1EBFn h\xE0nh t\u1ED1 t\u1EE5ng ho\u1EB7c tham gia t\u1ED1 t\u1EE5ng trong qu\xE1 tr\xECnh gi\u1EA3i quy\u1EBFt v\u1EE5 \xE1n (n\u1EBFu c\xF3).</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">c) Nh\u1EEFng v\u1EA5n \u0111\u1EC1 c\xF2n ch\u01B0a r\xF5 m\xE0 Ki\u1EC3m s\xE1t vi\xEAn c\u1EA7n ph\u1EA3i x\xE9t h\u1ECFi, l\xE0m r\xF5 t\u1EA1i phi\xEAn t\xF2a.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">d) C\xE1c t\xECnh ti\u1EBFt t\u0103ng n\u1EB7ng, gi\u1EA3m nh\u1EB9 tr\xE1ch nhi\u1EC7m h\xECnh s\u1EF1 c\u1EE7a b\u1ECB can/b\u1ECB c\xE1o (c\xE1c b\u1ECB can/b\u1ECB c\xE1o) theo \u0111\xFAng quy \u0111\u1ECBnh t\u1EA1i \u0110i\u1EC1u 51 v\xE0 \u0110i\u1EC1u 52 c\u1EE7a B\u1ED9 lu\u1EADt H\xECnh s\u1EF1.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">\u0111) X\xE1c \u0111\u1ECBnh r\xF5 nguy\xEAn nh\xE2n, \u0111i\u1EC1u ki\u1EC7n, ho\xE0n c\u1EA3nh ph\u1EA1m t\u1ED9i ...</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">2. \u0110\u1EC1 xu\u1EA5t </p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">a) V\u1EC1 tr\xE1ch nhi\u1EC7m h\xECnh s\u1EF1: </p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- \u0110\u1EC1 xu\u1EA5t c\u1EE5 th\u1EC3 v\u1EC1 t\u1ED9i danh theo \u0111i\u1EC3m ... kho\u1EA3n ... \u0110i\u1EC1u\u2026\u2026 c\u1EE7a B\u1ED9 lu\u1EADt H\xECnh s\u1EF1 v\xE0 c\xE1c v\u0103n b\u1EA3n h\u01B0\u1EDBng d\u1EABn \u0111\u01B0\u1EE3c \xE1p d\u1EE5ng.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">    - T\xECnh ti\u1EBFt t\u0103ng n\u1EB7ng, gi\u1EA3m nh\u1EB9 tr\xE1ch nhi\u1EC7m h\xECnh s\u1EF1.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">    - H\xECnh ph\u1EA1t ch\xEDnh, h\xECnh ph\u1EA1t b\u1ED5 sung, c\xE1c bi\u1EC7n ph\xE1p t\u01B0 ph\xE1p.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">b) X\u1EED l\xFD v\u1EADt ch\u1EE9ng: \u0110\u1EC1 xu\u1EA5t c\u1EE5 th\u1EC3 v\u1EC1 bi\u1EC7n ph\xE1p x\u1EED l\xFD v\u1EADt ch\u1EE9ng theo \u0111i\u1EC3m ... kho\u1EA3n \u2026.  \u0110i\u1EC1u \u2026 c\u1EE7a B\u1ED9 lu\u1EADt T\u1ED1 t\u1EE5ng h\xECnh s\u1EF1 v\xE0 c\xE1c v\u0103n b\u1EA3n h\u01B0\u1EDBng d\u1EABn \u0111\u01B0\u1EE3c \xE1p d\u1EE5ng.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">c) V\u1EC1 tr\xE1ch nhi\u1EC7m d\xE2n s\u1EF1: \u0110\u1EC1 xu\u1EA5t c\u1EE5 th\u1EC3 v\u1EC1 m\u1EE9c b\u1ED3i th\u01B0\u1EDDng thi\u1EC7t h\u1EA1i theo \u0111i\u1EC3m \u2026. kho\u1EA3n \u2026. \u0110i\u1EC1u\u2026 c\u1EE7a B\u1ED9 lu\u1EADt D\xE2n s\u1EF1 v\xE0 c\xE1c v\u0103n b\u1EA3n h\u01B0\u1EDBng d\u1EABn \u0111\u01B0\u1EE3c \xE1p d\u1EE5ng.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">d) \u0110\u1EC1 xu\u1EA5t ki\u1EBFn ngh\u1ECB kh\u1EAFc ph\u1EE5c ho\u1EB7c bi\u1EC7n ph\xE1p ph\xF2ng ng\u1EEBa vi ph\u1EA1m v\xE0 t\u1ED9i ph\u1EA1m (n\u1EBFu c\xF3)./.</p><p style="text-align: center; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">Ng\u01B0\u1EDDi b\xE1o c\xE1o</p><p style="text-align: center; margin-top: 6px; margin-bottom: 6px;">(K\xFD, ghi r\xF5 h\u1ECD t\xEAn)</p><table style="width: 100%; border-collapse: collapse; margin-bottom: 10px;"><tr><td style="vertical-align: top; padding: 5px; text-align: center;">QUAN \u0110I\u1EC2M C\u1EE6A L\xC3NH \u0110\u1EA0O C\u1EA4P V\u1EE4, PH\xD2NG, BAN <br/>(K\xFD, ghi r\xF5 h\u1ECD t\xEAn)<br/><br/>\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026<br/>\u2026\u2026\u2026.\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026.\u2026\u2026\u2026<br/>\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u202 </p><br/><p style="text-align: center; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">QUY\u1EBET \u0110\u1ECANH:</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">\u0110i\u1EC1u 1. Ph\xE2n c\xF4ng \xF4ng/b\xE0\u2026\u2026\u2026Ki\u1EC3m s\xE1t vi\xEAn\u2026\u2026..\u2026\u2026\u2026\u2026\u2026\u2026\u2026\u2026   th\u1EF1c h\xE0nh quy\u1EC1n c\xF4ng t\u1ED1, ki\u1EC3m s\xE1t vi\u1EC7c tu\xE2n theo ph\xE1p lu\u1EADt t\u1EA1i phi\xEAn h\u1ECDp x\xE9t kh\xE1ng c\xE1o qu\xE1 h\u1EA1n \u0111\u1ED1i v\u1EDBi b\u1ECB c\xE1o \u2026 b\u1ECB T\xF2a \xE1n\u2026. x\xE9t x\u1EED v\u1EC1 t\u1ED9i (ho\u1EB7c c\xE1c t\u1ED9i)\u2026\u2026\u2026 quy \u0111\u1ECBnh t\u1EA1i \u0111i\u1EC3m\u2026\u2026. kho\u1EA3n\u2026\u2026.. \u0110i\u1EC1u \u2026\u2026\u2026 c\u1EE7a B\u1ED9 lu\u1EADt H\xECnh s\u1EF1 t\u1EA1i b\u1EA3n \xE1n, quy\u1EBFt \u0111\u1ECBnh s\u1ED1\u2026 ng\xE0y\u2026 th\xE1ng\u2026 n\u0103m \u2026..</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">\u0110i\u1EC1u 2. Ph\xE2n c\xF4ng \xF4ng/b\xE0: \u2026\u2026\u2026\u2026. Ki\u1EC3m s\xE1t vi\xEAn5\u2026\u2026th\u1EF1c h\xE0nh quy\u1EC1n c\xF4ng t\u1ED1, ki\u1EC3m s\xE1t vi\u1EC7c tu\xE2n theo ph\xE1p lu\u1EADt t\u1EA1i phi\xEAn h\u1ECDp x\xE9t kh\xE1ng c\xE1o qu\xE1 h\u1EA1n v\u1EDBi t\u01B0 c\xE1ch l\xE0 Ki\u1EC3m s\xE1t vi\xEAn d\u1EF1 khuy\u1EBFt.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">\u0110i\u1EC1u 3. Ki\u1EC3m s\xE1t vi\xEAn c\xF3 t\xEAn n\xEAu t\u1EA1i \u0110i\u1EC1u 1 v\xE0 \u0110i\u1EC1u 2 Quy\u1EBFt \u0111\u1ECBnh n\xE0y th\u1EF1c hi\u1EC7n nhi\u1EC7m v\u1EE5, quy\u1EC1n h\u1EA1n theo quy \u0111\u1ECBnh c\u1EE7a ph\xE1p lu\u1EADt./.</p><table style="width: 100%; border-collapse: collapse; margin-bottom: 10px;"><tr><td style="vertical-align: top; padding: 5px; text-align: center;">N\u01A1i nh\u1EADn:<br/>- 8\u2026\u2026\u2026\u2026\u2026\u2026;<br/>- Ki\u1EC3m s\xE1t vi\xEAn c\xF3  \u2026.... Vi\u1EC7n ki\u1EC3m s\xE1t2\u2026\u2026 th\xF4ng b\xE1o r\xFAt kinh nghi\u1EC7m \u0111\u1ED1i v\u1EDBi Vi\u1EC7n ki\u1EC3m s\xE1t\u2026. trong vi\u1EC7c \u2026\u2026 \u0111\u1ED1i v\u1EDBi b\u1ECB c\xE1o/c\xE1c b\u1ECB c\xE1o \u2026.., nh\u1EB1m b\u1EA3o \u0111\u1EA3m cho vi\u1EC7c x\xE9t x\u1EED \u0111\xFAng ng\u01B0\u1EDDi, \u0111\xFAng t\u1ED9i, \u0111\xFAng quy \u0111\u1ECBnh c\u1EE7a ph\xE1p lu\u1EADt.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">N\u1ED9i dung v\u1EE5 \xE1n:</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">&nbsp;&nbsp;&nbsp;&nbsp;        N\xEAu t\xF3m t\u1EAFt n\u1ED9i dung v\u1EE5 \xE1n</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;">2. Qu\xE1 tr\xECnh gi\u1EA3i quy\u1EBFt v\u1EE5 \xE1n:</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">T\u1EA1i B\u1EA3n \xE1n h\xECnh s\u1EF1 s\u01A1 th\u1EA9m \u2026.. s\u1ED1  \u2026.. ng\xE0y....th\xE1ng....n\u0103m... c\u1EE7a To\xE0 \xE1n  \u2026\u2026 \xE1p d\u1EE5ng \u0111i\u1EC3m.... kho\u1EA3n .... \u0110i\u1EC1u c\u1EE7a B\u1ED9 lu\u1EADt H\xECnh s\u1EF1 x\u1EED ph\u1EA1t b\u1ECB c\xE1o/c\xE1c b\u1ECB c\xE1o \u2026\u2026. (m\u1EE9c h\xECnh ph\u1EA1t\u2026.) v\u1EC1 t\u1ED9i/c\xE1c t\u1ED9i \u2026\u2026</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">Ng\xE0y .... th\xE1ng .... n\u0103m\u2026. b\u1ECB c\xE1o/b\u1ECB h\u1EA1i/ng\u01B0\u1EDDi li\xEAn quan\u2026 kh\xE1ng c\xE1o, Vi\u1EC7n ki\u1EC3m s\xE1t \u2026.. kh\xE1ng ngh\u1ECB \u2026 (n\xEAu t\xF3m t\u1EAFt n\u1ED9i dung c\u1EE7a kh\xE1ng c\xE1o/kh\xE1ng ngh\u1ECB).</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">T\u1EA1i B\u1EA3n \xE1n h\xECnh s\u1EF1 s\u1ED1 \u2026. ng\xE0y \u2026 th\xE1ng\u2026 n\u0103mTo\xE0 \xE1n\u2026.. \xE1p d\u1EE5ng \u0111i\u1EC3m.... kho\u1EA3n .... \u0110i\u1EC1u\u2026. c\u1EE7a B\u1ED9 lu\u1EADt H\xECnh s\u1EF1 x\u1EED ph\u1EA1t b\u1ECB c\xE1o/ c\xE1c b\u1ECB c\xE1o \u2026. (m\u1EE9c h\xECnh ph\u1EA1t\u2026.)  v\u1EC1 t\u1ED9i/ c\xE1c t\u1ED9i \u2026\u2026...</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px; font-weight: bold;"> 3. Nh\u1EEFng v\u1EA5n \u0111\u1EC1 c\u1EA7n r\xFAt kinh nghi\u1EC7m:</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">   T\xF3m t\u1EAFt nh\u1EEFng vi ph\u1EA1m c\u1EA7n r\xFAt kinh nghi\u1EC7m: </p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- Do \xE1p d\u1EE5ng ph\xE1p lu\u1EADt kh\xF4ng \u0111\xFAng.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- Do x\xE9t x\u1EED t\u1ED9i danh kh\xF4ng \u0111\xFAng. </p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- Quy\u1EBFt \u0111\u1ECBnh h\xECnh ph\u1EA1t n\u1EB7ng/nh\u1EB9\u2026.... ch\u01B0a t\u01B0\u01A1ng x\u1EE9ng v\u1EDBi h\xE0nh vi ph\u1EA1m t\u1ED9i c\u1EE7a b\u1ECB c\xE1o.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- Do x\u1EED l\xFD v\u1EADt ch\u1EE9ng kh\xF4ng \u0111\xFAng.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- Do \xE1p d\u1EE5ng bi\u1EC7n ph\xE1p t\u01B0 ph\xE1p kh\xF4ng \u0111\xFAng.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- Do m\u1EE9c b\u1ED3i th\u01B0\u1EDDng thi\u1EC7t h\u1EA1i kh\xF4ng \u0111\xFAng.</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">- C\xE1c v\u1EA5n \u0111\u1EC1 kh\xE1c (n\u1EBFu c\xF3)</p><p style="text-align: left; margin-top: 6px; margin-bottom: 6px;">Vi\u1EC7n ki\u1EC3m s\xE1t2\u2026.. th\xF4ng b\xE1o \u0111\u1EC3 Vi\u1EC7n ki\u1EC3m s\xE1t9\u2026\u2026 nghi\xEAn c\u1EE9u, r\xFAt kinh nghi\u1EC7m chung/r\xFAt kinh nghi\u1EC7m to\xE0n ng\xE0nh nh\u1EB1m n\xE2ng cao ch\u1EA5t l\u01B0\u1EE3ng c\xF4ng t\xE1c th\u1EF1c h\xE0nh quy\u1EC1n c\xF4ng t\u1ED1, ki\u1EC3m s\xE1t x\xE9t x\u1EED c\xE1c v\u1EE5 \xE1n h\xECnh s\u1EF1./.</p><br/><table style="width: 100%; border-collapse: collaps     { id: "al-chm-10", soAnLe: "\xC1n l\u1EC7 s\u1ED1 10/2017/AL", tieuDe: "V\u1EC1 \xE1p d\u1EE5ng bi\u1EC7n ph\xE1p t\u1EA1m giam \u0111\u1EC3 \u0111i\u1EC1u tra trong v\u1EE5 \xE1n tham nh\u0169ng", linhVuc: "H\xECnh s\u1EF1 \u2013 Tham nh\u0169ng", ngayBanHanh: "2017", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "B\u1ECB can t\u1ED9i tham \xF4 b\u1ECB t\u1EA1m giam qu\xE1 th\u1EDDi h\u1EA1n m\xE0 ch\u01B0a c\xF3 quy\u1EBFt \u0111\u1ECBnh gia h\u1EA1n.", nguyenTacApDung: "Th\u1EDDi h\u1EA1n t\u1EA1m giam ph\u1EA3i \u0111\u01B0\u1EE3c gia h\u1EA1n theo \u0111\xFAng \u0110i\u1EC1u 173 BLTTHS; h\u1EBFt h\u1EA1n ch\u01B0a gia h\u1EA1n ph\u1EA3i tr\u1EA3 t\u1EF1 do ngay.", vanBanLienQuan: ["101/2015/QH13", "100/2015/QH13"], file: "An le 10.htm" },
    { id: "al-chm-20", soAnLe: "\xC1n l\u1EC7 s\u1ED1 20/2018/AL", tieuDe: "V\u1EC1 x\xE1c \u0111\u1ECBnh t\u1ED9i danh trong v\u1EE5 \xE1n c\xF3 nhi\u1EC1u ng\u01B0\u1EDDi ph\u1EA1m t\u1ED9i \u2013 \u0111\u1ED3ng ph\u1EA1m", linhVuc: "H\xECnh s\u1EF1", ngayBanHanh: "2018", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "Nh\xF3m \u0111\u1ED1i t\u01B0\u1EE3ng c\xF9ng th\u1EF1c hi\u1EC7n h\xE0nh vi c\u01B0\u1EDBp t\xE0i s\u1EA3n; x\xE1c \u0111\u1ECBnh vai tr\xF2 ch\u1EE7 m\u01B0u, \u0111\u1ED3ng ph\u1EA1m.", nguyenTacApDung: "X\xE1c \u0111\u1ECBnh vai tr\xF2 c\u1EE7a t\u1EEBng ng\u01B0\u1EDDi trong \u0111\u1ED3ng ph\u1EA1m (\u0110i\u1EC1u 17 BLHS): ng\u01B0\u1EDDi t\u1ED5 ch\u1EE9c, ng\u01B0\u1EDDi th\u1EF1c h\xE0nh, ng\u01B0\u1EDDi gi\xFAp s\u1EE9c, ng\u01B0\u1EDDi x\xFAi gi\u1EE5c c\xF3 m\u1EE9c h\xECnh ph\u1EA1t kh\xE1c nhau.", vanBanLienQuan: ["100/2015/QH13"], file: "An le 20.htm" },
    { id: "al-chm-30", soAnLe: "\xC1n l\u1EC7 s\u1ED1 30/2020/AL", tieuDe: "V\u1EC1 x\xE1c \u0111\u1ECBnh thi\u1EC7t h\u1EA1i v\xE0 b\u1ED3i th\u01B0\u1EDDng trong v\u1EE5 \xE1n tai n\u1EA1n giao th\xF4ng", linhVuc: "D\xE2n s\u1EF1 \u2013 Giao th\xF4ng", ngayBanHanh: "2020", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "N\u1EA1n nh\xE2n tai n\u1EA1n giao th\xF4ng y\xEAu c\u1EA7u b\u1ED3i th\u01B0\u1EDDng; tranh ch\u1EA5p v\u1EC1 m\u1EE9c b\u1ED3i th\u01B0\u1EDDng thi\u1EC7t h\u1EA1i s\u1EE9c kh\u1ECFe.", nguyenTacApDung: "Thi\u1EC7t h\u1EA1i v\u1EC1 s\u1EE9c kh\u1ECFe bao g\u1ED3m: chi ph\xED \u0111i\u1EC1u tr\u1ECB, thu nh\u1EADp b\u1ECB m\u1EA5t, t\u1ED5n th\u1EA5t tinh th\u1EA7n (\u0110i\u1EC1u 590 BLDS 2015); ph\u1EA3i b\u1ED3i th\u01B0\u1EDDng \u0111\u1EA7y \u0111\u1EE7 v\xE0 k\u1ECBp th\u1EDDi.", vanBanLienQuan: ["91/2015/QH13"], file: "An le 30.htm" },
    { id: "al-chm-40", soAnLe: "\xC1n l\u1EC7 s\u1ED1 40/2021/AL", tieuDe: "V\u1EC1 x\u1EED l\xFD t\xE0i s\u1EA3n k\xEA bi\xEAn khi ng\u01B0\u1EDDi ph\u1EA3i thi h\xE0nh \xE1n kh\xF4ng c\xF3 t\xE0i s\u1EA3n", linhVuc: "Thi h\xE0nh \xE1n d\xE2n s\u1EF1", ngayBanHanh: "2021", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "Ng\u01B0\u1EDDi ph\u1EA3i THA kh\xF4ng c\xF3 t\xE0i s\u1EA3n \u0111\u1EC3 thi h\xE0nh; ch\u1EA5p h\xE0nh vi\xEAn \u0111\xECnh ch\u1EC9 THA g\xE2y khi\u1EBFu n\u1EA1i.", nguyenTacApDung: "Ph\u1EA3i x\xE1c minh \u0111\u1EA7y \u0111\u1EE7 \u0111i\u1EC1u ki\u1EC7n THA theo \u0110i\u1EC1u 44 Lu\u1EADt THADS tr\u01B0\u1EDBc khi \u0111\xECnh ch\u1EC9; ph\u1EA3i \u0111\u1ECBnh k\u1EF3 x\xE1c minh l\u1EA1i.", vanBanLienQuan: ["26/2008/QH12", "106/2025/QH15"], file: "An le 40.htm" },
    { id: "al-chm-50", soAnLe: "\xC1n l\u1EC7 s\u1ED1 50/2022/AL", tieuDe: "V\u1EC1 x\xE1c \u0111\u1ECBnh th\u1EA9m quy\u1EC1n x\xE9t x\u1EED tranh ch\u1EA5p h\u1EE3p \u0111\u1ED3ng lao \u0111\u1ED9ng c\xF3 y\u1EBFu t\u1ED1 n\u01B0\u1EDBc ngo\xE0i", linhVuc: "Lao \u0111\u1ED9ng \u2013 T\u01B0 ph\xE1p qu\u1ED1c t\u1EBF", ngayBanHanh: "2022", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "Ng\u01B0\u1EDDi lao \u0111\u1ED9ng Vi\u1EC7t Nam l\xE0m vi\u1EC7c cho c\xF4ng ty n\u01B0\u1EDBc ngo\xE0i t\u1EA1i Vi\u1EC7t Nam tranh ch\u1EA5p h\u1EE3p \u0111\u1ED3ng lao \u0111\u1ED9ng.", nguyenTacApDung: "T\xF2a \xE1n Vi\u1EC7t Nam c\xF3 th\u1EA9m quy\u1EC1n x\xE9t x\u1EED khi h\u1EE3p \u0111\u1ED3ng th\u1EF1c hi\u1EC7n t\u1EA1i Vi\u1EC7t Nam (\u0110i\u1EC1u 469 BLTTDS 2015); \xE1p d\u1EE5ng ph\xE1p lu\u1EADt lao \u0111\u1ED9ng Vi\u1EC7t Nam.", vanBanLienQuan: ["45/2019/QH14", "92/2015/QH13"], file: "An le 50.htm" },
    { id: "al-chm-60", soAnLe: "\xC1n l\u1EC7 s\u1ED1 60/2023/AL", tieuDe: "V\u1EC1 quy\u1EC1n kh\u1EDFi ki\u1EC7n c\u1EE7a ng\u01B0\u1EDDi th\u1EE9 ba trong v\u1EE5 \xE1n tranh ch\u1EA5p h\u1EE3p \u0111\u1ED3ng", linhVuc: "D\xE2n s\u1EF1 \u2013 T\u1ED1 t\u1EE5ng", ngayBanHanh: "2023", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "Ng\u01B0\u1EDDi th\u1EE9 ba c\xF3 quy\u1EC1n l\u1EE3i ngh\u0129a v\u1EE5 li\xEAn quan y\xEAu c\u1EA7u T\xF2a b\u1EA3o v\u1EC7 quy\u1EC1n l\u1EE3i trong v\u1EE5 \xE1n d\xE2n s\u1EF1.", nguyenTacApDung: "Ng\u01B0\u1EDDi c\xF3 quy\u1EC1n l\u1EE3i ngh\u0129a v\u1EE5 li\xEAn quan c\xF3 quy\u1EC1n y\xEAu c\u1EA7u \u0111\u1ED9c l\u1EADp theo \u0110i\u1EC1u 73 BLTTDS 2015; T\xF2a ph\u1EA3i th\u1EE5 l\xFD v\xE0 gi\u1EA3i quy\u1EBFt.", vanBanLienQuan: ["91/2015/QH13", "92/2015/QH13"], file: "An le 60.htm" },
    { id: "al-chm-70", soAnLe: "\xC1n l\u1EC7 s\u1ED1 70/2023/AL", tieuDe: "V\u1EC1 x\xE1c \u0111\u1ECBnh t\u1ED9i ph\u1EA1m trong tr\u01B0\u1EDDng h\u1EE3p d\xF9ng th\u1EE7 \u0111o\u1EA1n tinh vi chi\u1EBFm \u0111o\u1EA1t t\xE0i s\u1EA3n qua giao d\u1ECBch d\xE2n s\u1EF1 gi\u1EA3 t\u1EA1o", linhVuc: "H\xECnh s\u1EF1 \u2013 Kinh t\u1EBF", ngayBanHanh: "2023", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "B\u1ECB c\xE1o k\xFD h\u1EE3p \u0111\u1ED3ng vay ti\u1EC1n nh\u01B0ng th\u1EF1c ch\u1EA5t l\xE0 chi\u1EBFm \u0111o\u1EA1t; tranh lu\u1EADn gi\u1EEFa t\u1ED9i l\u1EEBa \u0111\u1EA3o v\xE0 vi ph\u1EA1m h\u1EE3p \u0111\u1ED3ng d\xE2n s\u1EF1.", nguyenTacApDung: "Khi ng\u01B0\u1EDDi ph\u1EA1m t\u1ED9i ngay t\u1EEB \u0111\u1EA7u c\xF3 \xFD th\u1EE9c chi\u1EBFm \u0111o\u1EA1t, d\xF9ng h\u1EE3p \u0111\u1ED3ng d\xE2n s\u1EF1 l\xE0m v\u1ECF b\u1ECDc th\xEC c\u1EA5u th\xE0nh t\u1ED9i L\u1EEBa \u0111\u1EA3o chi\u1EBFm \u0111o\u1EA1t t\xE0i s\u1EA3n (\u0110i\u1EC1u 174 BLHS), kh\xF4ng ph\u1EA3i quan h\u1EC7 d\xE2n s\u1EF1.", vanBanLienQuan: ["100/2015/QH13", "91/2015/QH13"], file: "An le 70.htm" },
    { id: "al-chm-80", soAnLe: "\xC1n l\u1EC7 s\u1ED1 80/2024/AL", tieuDe: "V\u1EC1 x\u1EED l\xFD v\u1EADt ch\u1EE9ng l\xE0 ph\u01B0\u01A1ng ti\u1EC7n ph\u1EA1m t\u1ED9i trong v\u1EE5 \xE1n ma t\xFAy", linhVuc: "H\xECnh s\u1EF1 \u2013 Ma t\xFAy", ngayBanHanh: "2024", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "Xe \xF4 t\xF4 \u0111\u01B0\u1EE3c d\xF9ng \u0111\u1EC3 v\u1EADn chuy\u1EC3n ma t\xFAy; tranh ch\u1EA5p v\u1EC1 vi\u1EC7c t\u1ECBch thu hay tr\u1EA3 l\u1EA1i cho ch\u1EE7 s\u1EDF h\u1EEFu kh\xF4ng li\xEAn quan.", nguyenTacApDung: "Ph\u01B0\u01A1ng ti\u1EC7n ph\u1EA1m t\u1ED9i b\u1ECB t\u1ECBch thu theo \u0110i\u1EC1u 47 BLHS; tuy nhi\xEAn n\u1EBFu ch\u1EE7 ph\u01B0\u01A1ng ti\u1EC7n kh\xF4ng bi\u1EBFt v\xE0 kh\xF4ng li\xEAn quan, H\u1ED9i \u0111\u1ED3ng xem x\xE9t tr\u1EA3 l\u1EA1i theo t\u1EEBng tr\u01B0\u1EDDng h\u1EE3p c\u1EE5 th\u1EC3.", vanBanLienQuan: ["100/2015/QH13"], file: "An le 80.htm" },
    { id: "al-chm-ds", soAnLe: "\xC1n l\u1EC7 d\xE2n s\u1EF1 t\u1ED5ng h\u1EE3p", tieuDe: "T\u1ED5ng h\u1EE3p \xE1n l\u1EC7 v\u1EC1 d\xE2n s\u1EF1 \u2013 h\xF4n nh\xE2n gia \u0111\xECnh \u2013 th\u1EEBa k\u1EBF", linhVuc: "D\xE2n s\u1EF1 t\u1ED5ng h\u1EE3p", ngayBanHanh: "2016\u20132024", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "T\u1EADp h\u1EE3p c\xE1c \xE1n l\u1EC7 quan tr\u1ECDng v\u1EC1 d\xE2n s\u1EF1, h\xF4n nh\xE2n gia \u0111\xECnh v\xE0 th\u1EEBa k\u1EBF t\u1EEB n\u0103m 2016 \u0111\u1EBFn 2024.", nguyenTacApDung: "\xC1p d\u1EE5ng c\xE1c nguy\xEAn t\u1EAFc c\u01A1 b\u1EA3n c\u1EE7a BLDS 2015 v\u1EC1 h\u1EE3p \u0111\u1ED3ng, th\u1EEBa k\u1EBF, t\xE0i s\u1EA3n trong h\xF4n nh\xE2n.", vanBanLienQuan: ["91/2015/QH13"], file: "An le dan su.htm" },
    { id: "al-chm-hs", soAnLe: "\xC1n l\u1EC7 h\xECnh s\u1EF1 t\u1ED5ng h\u1EE3p", tieuDe: "T\u1ED5ng h\u1EE3p \xE1n l\u1EC7 v\u1EC1 h\xECnh s\u1EF1 \u2013 t\u1ED9i ph\u1EA1m v\xE0 h\xECnh ph\u1EA1t", linhVuc: "H\xECnh s\u1EF1 t\u1ED5ng h\u1EE3p", ngayBanHanh: "2016\u20132024", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "T\u1EADp h\u1EE3p c\xE1c \xE1n l\u1EC7 v\u1EC1 \u0111\u1ECBnh t\u1ED9i danh, quy\u1EBFt \u0111\u1ECBnh h\xECnh ph\u1EA1t, c\xE1c t\xECnh ti\u1EBFt t\u0103ng n\u1EB7ng gi\u1EA3m nh\u1EB9 trong \xE1n h\xECnh s\u1EF1.", nguyenTacApDung: "\xC1p d\u1EE5ng BLHS 2015 v\xE0 c\xE1c ngh\u1ECB quy\u1EBFt h\u01B0\u1EDBng d\u1EABn c\u1EE7a H\u0110TP TAND T\u1ED1i cao.", vanBanLienQuan: ["100/2015/QH13", "101/2015/QH13"], file: "An le hinh su.htm" },
    { id: "al-chm-90", soAnLe: "\xC1n l\u1EC7 s\u1ED1 90/2024/AL", tieuDe: "V\u1EC1 \xE1p d\u1EE5ng Lu\u1EADt \u0110\u1EA5t \u0111ai 2024 trong gi\u1EA3i quy\u1EBFt tranh ch\u1EA5p \u0111\u1EA5t \u0111ai", linhVuc: "\u0110\u1EA5t \u0111ai \u2013 D\xE2n s\u1EF1", ngayBanHanh: "2024", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "Tranh ch\u1EA5p quy\u1EC1n s\u1EED d\u1EE5ng \u0111\u1EA5t sau khi Lu\u1EADt \u0110\u1EA5t \u0111ai 2024 c\xF3 hi\u1EC7u l\u1EF1c; x\xE1c \u0111\u1ECBnh lu\u1EADt \xE1p d\u1EE5ng v\xE0 c\u0103n c\u1EE9 \u0111\u0103ng k\xFD bi\u1EBFn \u0111\u1ED9ng.", nguyenTacApDung: "V\u1EE5 vi\u1EC7c ph\xE1t sinh sau 01/08/2024 \xE1p d\u1EE5ng Lu\u1EADt \u0110\u1EA5t \u0111ai 2024; k\u1EBFt h\u1EE3p xem x\xE9t qu\xE1 tr\xECnh s\u1EED d\u1EE5ng \u0111\u1EA5t \u1ED5n \u0111\u1ECBnh v\xE0 h\u1ED3 s\u01A1 \u0111\u0103ng k\xFD.", vanBanLienQuan: ["31/2024/QH15", "91/2015/QH13"], file: "An le 90.htm" },
    { id: "al-chm-72", soAnLe: "\xC1n l\u1EC7 s\u1ED1 72/2024/AL", tieuDe: "V\u1EC1 \u0111\u1ECBnh t\u1ED9i Cho vay l\xE3i n\u1EB7ng trong giao d\u1ECBch d\xE2n s\u1EF1", linhVuc: "H\xECnh s\u1EF1 \u2013 Kinh t\u1EBF", ngayBanHanh: "2024", coQuan: "TAND T\u1ED1i cao", tomTatVuViec: "Cho vay v\u1EDBi l\xE3i su\u1EA5t v\u01B0\u1EE3t 20%/n\u0103m, thu l\u1EE3i b\u1EA5t ch\xEDnh l\u1EDBn; ph\xE2n bi\u1EC7t v\u1EDBi tranh ch\u1EA5p d\xE2n s\u1EF1 v\u1EC1 l\xE3i su\u1EA5t.", nguyenTacApDung: "\u0110\u1EE7 y\u1EBFu t\u1ED1 \u0110i\u1EC1u 201 BLHS th\xEC truy c\u1EE9u tr\xE1ch nhi\u1EC7m h\xECnh s\u1EF1; ph\u1EA7n l\xE3i su\u1EA5t v\u01B0\u1EE3t 20%/n\u0103m trong quan h\u1EC7 d\xE2n s\u1EF1 b\u1ECB v\xF4 hi\u1EC7u theo \u0110i\u1EC1u 468 BLDS.", vanBanLienQuan: ["100/2015/QH13", "91/2015/QH13"], file: "An le 72.htm" }
  ];

      item.soHieu,
      item.soAnLe,
      item.soThongBao,
      item.maQuyTrinh,
      item.coQuan,
      item.capBanHanh,
      item.tomTat,
      item.moTa,
      item.noiDung,
      item.tomTatVuViec,
      item.nguyenTacApDung,
      item.noiDungViPham,
      item.baiHoc,
      item.bienPhap,
      item.loai,
      typeof item.linhVuc === "string" ? item.linhVuc : "",
      ...item.tags || [],
      ...item.cacBuoc || [],
      ...item.vanBanCanCu || [],
      ...item.vanBanLienQuan || []
    ].filter(Boolean).join(" ").toLowerCase();
  }
  function filterItems(items, query) {
    const q = query.trim().toLowerCase();
    if (!q) return items;
    const nq = normalizeText(q);
    const words = nq.split(/\s+/).filter((w) => w.length > 1);
    return items.filter((item) => {
      const hay = itemHaystack(item);
      const nhay = normalizeText(hay);
      if (hay.includes(q) || nhay.includes(nq)) return true;
      return words.length > 0 && words.every((w) => nhay.includes(w));
    });
  }
  function itemExcerpt(item, max = 140) {
    const raw = item.tomTat || item.moTa || item.tomTatVuViec || item.noiDungViPham || item.nguyenTacApDung || item.noiDung || "";
    if (raw.length <= max) return raw;
    return raw.slice(0, max).trimEnd() + "\u2026";
  }
  function itemMeta(item) {
    return [
      item.coQuan || item.capBanHanh,
      item.ngayBanHanh,
      item.nam ? `N\u0103m ${item.nam}` : "",
      typeof item.linhVuc === "string" ? item.linhVuc : ""
    ].filter(Boolean).join(" \xB7 ");
  }
  function summarizeItem(item, type) {
    const title = itemTitle(item);
    const lines = [type ? `[${KIND_LABEL[type]}] ${title}` : `\u2022 ${title}`];
    const so = item.soHieu || item.soAnLe || item.soThongBao || item.maQuyTrinh;
    if (so) lines.push(`  S\u1ED1 hi\u1EC7u: ${so}`);
    if (item.coQuan || item.capBanHanh) lines.push(`  C\u01A1 quan: ${item.coQuan || item.capBanHanh}`);
    if (item.ngayBanHanh) lines.push(`  Ng\xE0y ban h\xE0nh: ${item.ngayBanHanh}`);
    if (item.loai) lines.push(`  Lo\u1EA1i: ${item.loai}`);
    if (typeof item.linhVuc === "string" && item.linhVuc) lines.push(`  L\u0129nh v\u1EF1c: ${item.linhVuc}`);
    const body = item.tomTat || item.moTa || item.tomTatVuViec || item.noiDung || item.nguyenTacApDung || item.noiDungViPham || item.baiHoc || "";
    if (body) lines.push(`  T\xF3m t\u1EAFt: ${body.substring(0, 420)}`);
    return lines.join("\n");
  }
  function searchKnowledge(query, knowledge, limit = 8) {
    const words = normalizeText(query).split(/\s+/).filter((w) => w.length > 1);
    if (!words.length) return [];
    const pools = [
      ...knowledge.DOCS.map((i) => ({ item: i, type: "vb" })),
      ...knowledge.QUYTRINH.map((i) => ({ item: i, type: "qt" })),
      ...knowledge.RKN.map((i) => ({ item: i, type: "rkn" })),
      ...knowledge.ANLE.map((i) => ({ item: i, type: "al" })),
      ...knowledge.CONGVAN.map((i) => ({ item: i, type: "cv" })),
      ...knowledge.BIEUMAU.map((i) => ({ item: i, type: "bm" }))
    ];
    return pools.map(({ item, type }) => {
      const haystack = normalizeText(itemHaystack(item));
      const score = words.reduce((s, w) => s + (haystack.includes(w) ? 1 : 0), 0);
      return { item, type, score };
    }).filter((x) => x.score > 0).sort((a, b) => b.score - a.score).slice(0, limit);
  }
  function localAnswer(query, knowledge, contextItem) {
    const hits = searchKnowledge(query, knowledge, 8);
    const parts = [];
    if (contextItem) {
      parts.push("V\u0103n b\u1EA3n \u0111ang xem:\n" + summarizeItem(contextItem));
    }
    if (!hits.length) {
      parts.push(
        contextItem ? "Kh\xF4ng c\xF3 th\xEAm k\u1EBFt qu\u1EA3 kh\xE1c trong kho. B\u1EA1n th\u1EED s\u1ED1 hi\u1EC7u, t\xEAn lu\u1EADt ho\u1EB7c t\u1EEB kh\xF3a (v\xED d\u1EE5: BLHS, \u0111\u1EA5t \u0111ai, \xE1n l\u1EC7)." : "Kh\xF4ng t\xECm th\u1EA5y trong c\u01A1 s\u1EDF d\u1EEF li\u1EC7u. B\u1EA1n th\u1EED s\u1ED1 hi\u1EC7u, t\xEAn lu\u1EADt, \xE1n l\u1EC7 ho\u1EB7c t\u1EEB kh\xF3a kh\xE1c."
      );
      return parts.join("\n\n");
    }
    parts.push(
      "K\u1EBFt qu\u1EA3 tra c\u1EE9u trong kho v\u0103n b\u1EA3n (kh\xF4ng k\u1EBFt n\u1ED1i m\u1EA1ng):\n\n" + hits.map((h) => summarizeItem(h.item, h.type)).join("\n\n")
    );
    parts.push("\u0110\xE2y l\xE0 h\u1ED7 tr\u1EE3 tra c\u1EE9u \u2014 \u0111\u1ED1i chi\u1EBFu v\u0103n b\u1EA3n g\u1ED1c tr\u01B0\u1EDBc khi \u0111\u1EC1 xu\u1EA5t, ki\u1EBFn ngh\u1ECB, kh\xE1ng ngh\u1ECB.");
    return parts.join("\n\n");
  }
  return __toCommonJS(standalone_exports);
})();
</script>
<script>
// @ts-nocheck
(function () {
  var V = VanBanPl;
  var MENU = V.MENU;
  var KNOWLEDGE = V.KNOWLEDGE;
  var COUNTS = V.COUNTS;
  var prefs = V.loadPrefs();
  var openGroups = { vb: true, saved: true };
  var activeChild = null;
  var activeGroup = "";
  var selected = null;
  var query = "";
  var sidebarOpen = false;
  var aiOpen = false;
  var aiInput = "";
  var aiMsgs = [
    {
      id: 0,
      role: "ai",
      text: "Xin chào bạn. Tôi tra cứu trong kho văn bản pháp luật, quy trình, án lệ, rút kinh nghiệm và công văn của Viện KSND thành phố Cần Thơ — không cần mạng.\n\nBạn hỏi số hiệu, tên luật, án lệ hoặc tình huống nghiệp vụ.",
    },
  ];

  function esc(s) {
    return String(s || "").replace(/[&<>"']/g, function (c) {
      if (c === "&") return "\u0026amp;";
      if (c === "<") return "\u0026lt;";
      if (c === ">") return "\u0026gt;";
      if (c === '"') return "\u0026quot;";
      return "\u0026#39;";
    });
  }

  function el(id) {
    return document.getElementById(id);
  }

  function persist(next) {
    prefs = next;
    V.savePrefs(next);
  }

  function visibleItems() {
    if (!activeChild) {
      if (query.trim().length < 2) return [];
      var all = KNOWLEDGE.DOCS.concat(KNOWLEDGE.QUYTRINH, KNOWLEDGE.RKN, KNOWLEDGE.ANLE, KNOWLEDGE.CONGVAN, KNOWLEDGE.BIEUMAU);
      return V.filterItems(all, query);
    }
    return V.filterItems(activeChild.data.filter(activeChild.filter), query);
  }

  function pillStatus(item) {
    var html = "";
    if (item.loai) {
      var c = V.itemColor(item, activeChild ? activeChild.type : "vb");
      html += '<span class="vb-pill" style="background:' + c + "1E;color:" + c + '">' + esc(item.loai) + "</span>";
    }
    if (item.hieu) {
      html += '<span class="vb-pill ' + (item.hieu === "Còn hiệu lực" ? "on" : "off") + '">' + esc(item.hieu) + "</span>";
    }
    if (item.trangThai) {
      html += '<span class="vb-pill ' + (item.trangThai === "Đang áp dụng" ? "on" : "soon") + '">' + esc(item.trangThai) + "</span>";
    }
    return html;
  }

  function tags(arr) {
    if (!arr || !arr.length) return "";
    return (
      '<div class="vb-tags">' +
      arr
        .map(function (t) {
          return '<span class="vb-tag">' + esc(t) + "</span>";
        })
        .join("") +
      "</div>"
    );
  }

  function sec(label, inner) {
    if (!inner) return "";
    return '<div class="vb-sec"><div class="vb-sec-l">' + esc(label) + '</div><div class="vb-sec-v">' + inner + '</div></div>';
  }

  function renderSidebar() {
    var hist = "";
    if (prefs.searchHistory.length && !query) {
      hist =
        '<div class="vb-hist">' +
        prefs.searchHistory
          .slice(0, 4)
          .map(function (h) {
            return '<button type="button" class="vb-chip" data-hist="' + esc(h.query) + '">' + esc(h.query) + "</button>";
          })
          .join("") +
        '<button type="button" class="vb-chip dim" data-clear-hist="1">Xóa</button></div>';
    }
    var saved = "";
    if (prefs.bookmarks.length) {
      saved =
        '<div class="vb-acc">' +
        '<button type="button" class="vb-acc-h' +
        (openGroups.saved ? " open" : "") +
        '" data-grp="saved"><span class="n">★</span><span>ĐÃ LƯU</span><span class="a">▼</span></button>' +
        '<div class="vb-acc-b' +
        (openGroups.saved ? " open" : "") +
        '">' +
        prefs.bookmarks
          .map(function (bm) {
            return (
              '<div class="vb-bm"><button type="button" class="vb-item" data-bm="' +
              esc(bm.key) +
              '" data-bm-type="' +
              esc(bm.type) +
              '">★ ' +
              esc(bm.title) +
              '</button><button type="button" class="vb-x" data-rm="' +
              esc(bm.key) +
              '">×</button></div>'
            );
          })
          .join("") +
        "</div></div>";
    }
    var groups = MENU.map(function (g) {
      var isOpen = !!openGroups[g.id];
      var kids = g.children
        .map(function (ch) {
          var count = ch.data.filter(ch.filter).length;
          var on = activeChild && activeChild.id === ch.id;
          return (
            '<button type="button" class="vb-item' +
            (on ? " on" : "") +
            '" data-gid="' +
            g.id +
            '" data-cid="' +
            ch.id +
            '">' +
            esc(ch.label) +
            (count ? '<span class="vb-badge">' + count + "</span>" : "") +
            "</button>"
          );
        })
        .join("");
      return (
        '<div class="vb-acc"><button type="button" class="vb-acc-h' +
        (isOpen ? " open" : "") +
        '" data-grp="' +
        g.id +
        '"><span class="n">' +
        g.num +
        '.</span><span>' +
        esc(g.title) +
        '</span><span class="a">▼</span></button><div class="vb-acc-b' +
        (isOpen ? " open" : "") +
        '">' +
        kids +
        "</div></div>"
      );
    }).join("");
    el("vb-side").innerHTML =
      '<div class="vb-search"><input id="vb-q" type="search" placeholder="Tìm số hiệu, tên luật, án lệ…" value="' +
      esc(query) +
      '" />' +
      hist +
      "</div>" +
      saved +
      groups;
    var inp = el("vb-q");
    if (inp) {
      inp.addEventListener("input", function () {
        query = inp.value;
        renderMain();
      });
    }
  }

  function findChild(gid, cid) {
    for (var i = 0; i < MENU.length; i++) {
      if (MENU[i].id !== gid) continue;
      for (var j = 0; j < MENU[i].children.length; j++) {
        if (MENU[i].children[j].id === cid) return { group: MENU[i], child: MENU[i].children[j] };
      }
    }
    return null;
  }

  function welcomeHtml() {
    var stats = [
      [COUNTS.docs, "Văn bản pháp luật"],
      [COUNTS.quytrinh, "Quy trình nghiệp vụ"],
      [COUNTS.anle, "Án lệ"],
      [COUNTS.rkn, "Rút kinh nghiệm"],
      [COUNTS.congvan, "Công văn & hướng dẫn"],
      [COUNTS.bieumau, "Biểu mẫu tố tụng"],
    ]
      .map(function (s) {
        return '<div class="vb-stat"><b>' + s[0] + "</b><span>" + esc(s[1]) + "</span></div>";
      })
      .join("");
    var btns = MENU.map(function (g) {
      var last = g.children[g.children.length - 1];
      return (
        '<button type="button" class="vb-chip" data-gid="' +
        g.id +
        '" data-cid="' +
        last.id +
        '">' +
        g.num +
        ". " +
        esc(g.title) +
        "</button>"
      );
    }).join("");
    return (
      '<div class="vb-welcome"><div class="vb-ico">⚖️</div><h2>Kho văn bản pháp luật và nghiệp vụ kiểm sát</h2><p>Chọn nhóm danh mục bên trái hoặc gõ từ khóa để tra cứu. Dữ liệu nằm trong phần mềm — dùng được khi không có mạng.</p><div class="vb-stats">' +
      stats +
      '</div><div class="vb-quick">' +
      btns +
      '</div><p class="muted">Công cụ hỗ trợ — đối chiếu văn bản gốc trước khi kiến nghị, kháng nghị.</p></div>'
    );
  }

  function listHtml() {
    var items = visibleItems();
    var label = activeChild ? activeChild.label : "Kết quả tìm kiếm";
    var group = activeGroup || "TOÀN BỘ KHO";
    var type = activeChild ? activeChild.type : "vb";
    var cards = items
      .map(function (item, idx) {
        var c = V.itemColor(item, type);
        var title = V.itemTitle(item);
        var excerpt = V.itemExcerpt(item, 115);
        var metas = V.itemMeta(item);
        return (
          '<button type="button" class="vb-card" data-idx="' +
          idx +
          '" style="border-left-color:' +
          c +
          '"><div class="vb-card-top"><div><div class="vb-card-t">' +
          esc(title) +
          "</div>" +
          (metas ? '<div class="vb-card-m">' + esc(metas) + "</div>" : "") +
          '</div><div class="vb-pills">' +
          pillStatus(item) +
          "</div></div>" +
          (excerpt ? '<div class="vb-card-x">' + esc(excerpt) + "</div>" : "") +
          "</button>"
        );
      })
      .join("");
    return (
      '<div class="vb-pane"><div class="vb-bc">' +
      esc(group) +
      " › " +
      esc(label) +
      '</div><div class="vb-head"><h2>' +
      esc(label) +
      '</h2><div class="muted">' +
      items.length +
      " văn bản" +
      (query ? " · Lọc: “" + esc(query) + "”" : "") +
      "</div></div>" +
      (items.length
        ? '<div class="vb-list">' + cards + "</div>"
        : '<div class="vb-empty">Không tìm thấy kết quả' + (query ? " cho “" + esc(query) + "”" : "") + ".</div>") +
      "</div>"
    );
  }

  function detailHtml() {
    var item = selected;
    var type = activeChild ? activeChild.type : "vb";
    var c = V.itemColor(item, type);
    var title = V.itemTitle(item);
    var body = "";
    if (type === "vb") {
      body =
        sec("Số hiệu", "<b>" + esc(item.soHieu) + "</b>") +
        '<div class="vb-hr"></div>' +
        sec("Cơ quan ban hành", esc(item.coQuan)) +
        sec("Ngày ban hành → Ngày có hiệu lực", esc(item.ngayBanHanh) + " → " + esc(item.ngayHieuLuc)) +
        '<div class="vb-hr"></div>' +
        sec("Tóm tắt nội dung", esc(item.tomTat || "(Chưa có tóm tắt)")) +
        (item.tags && item.tags.length ? sec("Từ khóa", tags(item.tags)) : "");
    } else if (type === "al") {
      body =
        sec("Số án lệ", "<b>" + esc(item.soAnLe) + "</b>") +
        sec("Lĩnh vực — Cơ quan — Ngày ban hành", esc(item.linhVuc) + " · " + esc(item.coQuan) + " · " + esc(item.ngayBanHanh)) +
        '<div class="vb-hr"></div>' +
        sec("Tóm tắt vụ việc", esc(item.tomTatVuViec)) +
        sec("Nội dung án lệ", esc(item.noiDung)) +
        (item.nguyenTacApDung ? '<div class="vb-hi">' + esc(item.nguyenTacApDung) + "</div>" : "") +
        (item.vanBanLienQuan && item.vanBanLienQuan.length ? sec("Văn bản liên quan", tags(item.vanBanLienQuan)) : "") +
        (item.tags && item.tags.length ? sec("Từ khóa", tags(item.tags)) : "");
    } else if (type === "qt") {
      var steps =
        item.cacBuoc && item.cacBuoc.length
          ? "<ol>" +
            item.cacBuoc
              .map(function (b) {
                return "<li>" + esc(b) + "</li>";
              })
              .join("") +
            "</ol>"
          : "";
      body =
        sec("Mã quy trình — Loại — Ngày ban hành", esc(item.maQuyTrinh) + " · " + esc(item.loai) + " · " + esc(item.ngayBanHanh)) +
        '<div class="vb-hr"></div>' +
        sec("Mô tả", esc(item.moTa)) +
        (steps ? sec("Các bước thực hiện", steps) : "") +
        (item.vanBanCanCu && item.vanBanCanCu.length ? sec("Văn bản căn cứ", tags(item.vanBanCanCu)) : "");
    } else if (type === "cv") {
      body =
        sec("Số hiệu", "<b>" + esc(item.soHieu) + "</b>") +
        sec("Cơ quan ban hành — Năm — Lĩnh vực", esc(item.coQuan) + " · " + esc(item.nam) + " · " + esc(item.linhVuc)) +
        (item.tomTat ? '<div class="vb-hr"></div>' + sec("Tóm tắt nội dung", esc(item.tomTat)) : "");
    } else if (type === "rkn") {
      body =
        sec("Số thông báo", "<b>" + esc(item.soThongBao) + "</b>") +
        sec("Cơ quan — Lĩnh vực — Ngày", esc(item.capBanHanh) + " · " + esc(item.linhVuc) + " · " + esc(item.ngayBanHanh)) +
        '<div class="vb-hr"></div>' +
        sec("Nội dung vi phạm / tồn tại", esc(item.noiDungViPham)) +
        sec("Bài học kinh nghiệm", esc(item.baiHoc)) +
        sec("Biện pháp khắc phục", esc(item.bienPhap));
    } else if (type === "bm") {
      body = '<div class="vb-form">' + (item.htmlContent || "") + "</div>";
    } else {
      body = sec("Nội dung", esc(item.moTa || item.tomTat || item.noiDung || item.noiDungViPham || ""));
    }
    var book = V.isBookmarked(prefs, item, type);
    return (
      '<div class="vb-pane"><button type="button" class="vb-back" data-back="1">← Quay lại danh sách</button>' +
      '<div class="vb-pills">' +
      '<span class="vb-pill" style="background:' +
      c +
      "22;color:" +
      c +
      '">' +
      esc(item.loai || V.KIND_LABEL[type]) +
      "</span>" +
      pillStatus(item) +
      "</div>" +
      "<h1>" +
      esc(title) +
      "</h1>" +
      '<div class="vb-meta">' +
      (item.coQuan || item.capBanHanh ? "<span>🏛️ " + esc(item.coQuan || item.capBanHanh) + "</span>" : "") +
      (item.ngayBanHanh ? "<span>📅 " + esc(item.ngayBanHanh) + "</span>" : "") +
      (item.nam ? "<span>📅 Năm " + esc(item.nam) + "</span>" : "") +
      (typeof item.linhVuc === "string" && item.linhVuc ? "<span>📂 " + esc(item.linhVuc) + "</span>" : "") +
      "</div>" +
      '<div class="vb-body">' +
      body +
      "</div>" +
      '<div class="vb-acts"><button type="button" class="btn ' +
      (book ? "on" : "") +
      '" data-bm-toggle="1">' +
      (book ? "★ Đã lưu" : "☆ Lưu văn bản") +
      "</button>" +
      (item.link ? '<a class="btn on" href="' + esc(item.link) + '" target="_blank" rel="noopener">🔗 Xem toàn văn</a>' : "") +
      '<button type="button" class="btn" data-print="1">📄 In / Xuất PDF</button></div></div>'
    );
  }

  function renderMain() {
    var root = el("vb-main");
    if (!activeChild && query.trim().length < 2) root.innerHTML = welcomeHtml();
    else if (selected && activeChild) root.innerHTML = detailHtml();
    else root.innerHTML = listHtml();
  }

  function renderAi() {
    var msgs = aiMsgs
      .map(function (m) {
        return (
          '<div class="vb-msg ' +
          m.role +
          '"><div class="who">' +
          (m.role === "user" ? "Bạn" : "Kho văn bản") +
          '</div><div class="bubble">' +
          esc(m.text) +
          "</div></div>"
        );
      })
      .join("");
    el("vb-chat").innerHTML = msgs;
    el("vb-chat").scrollTop = el("vb-chat").scrollHeight;
  }

  function renderChrome() {
    document.body.classList.toggle("vb-side-open", sidebarOpen);
    document.body.classList.toggle("vb-ai-open", aiOpen);
  }

  function sendAi() {
    var text = (el("vb-ai-in").value || "").trim();
    if (!text) return;
    aiMsgs.push({ id: Date.now(), role: "user", text: text });
    el("vb-ai-in").value = "";
    aiMsgs.push({ id: Date.now() + 1, role: "ai", text: V.localAnswer(text, KNOWLEDGE, selected) });
    renderAi();
  }

  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-grp],[data-gid],[data-cid],[data-bm],[data-rm],[data-hist],[data-clear-hist],[data-idx],[data-back],[data-bm-toggle],[data-print],[data-ai],[data-menu],[data-overlay],[data-ai-send],[data-qchip]");
    if (!t) return;
    if (t.getAttribute("data-overlay") != null) {
      sidebarOpen = false;
      aiOpen = false;
      renderChrome();
      return;
    }
    if (t.getAttribute("data-menu") != null) {
      sidebarOpen = !sidebarOpen;
      aiOpen = false;
      renderChrome();
      return;
    }
    if (t.getAttribute("data-ai") != null) {
      aiOpen = !aiOpen;
      sidebarOpen = false;
      renderChrome();
      return;
    }
    if (t.getAttribute("data-grp")) {
      var gid = t.getAttribute("data-grp");
      openGroups[gid] = !openGroups[gid];
      renderSidebar();
      return;
    }
    if (t.getAttribute("data-clear-hist")) {
      persist(V.clearSearchHistory(prefs));
      renderSidebar();
      return;
    }
    if (t.getAttribute("data-hist")) {
      query = t.getAttribute("data-hist");
      renderSidebar();
      renderMain();
      return;
    }
    if (t.getAttribute("data-rm")) {
      persist(V.removeBookmark(prefs, t.getAttribute("data-rm")));
      renderSidebar();
      return;
    }
    if (t.getAttribute("data-bm") && t.getAttribute("data-bm-type")) {
      var item = V.findItemByKey(KNOWLEDGE, t.getAttribute("data-bm"));
      if (!item) return;
      var ctx = V.findMenuChildForItem(item, t.getAttribute("data-bm-type"));
      if (!ctx) return;
      activeChild = ctx.child;
      activeGroup = ctx.group.title;
      selected = item;
      query = "";
      sidebarOpen = false;
      renderChrome();
      renderSidebar();
      renderMain();
      return;
    }
    if (t.getAttribute("data-gid") && t.getAttribute("data-cid")) {
      var found = findChild(t.getAttribute("data-gid"), t.getAttribute("data-cid"));
      if (!found) return;
      activeChild = found.child;
      activeGroup = found.group.title;
      selected = null;
      query = "";
      sidebarOpen = false;
      renderChrome();
      renderSidebar();
      renderMain();
      return;
    }
    if (t.getAttribute("data-idx") != null) {
      var list = visibleItems();
      selected = list[Number(t.getAttribute("data-idx"))] || null;
      if (activeChild && query.trim().length >= 2) {
        persist(V.addSearchHistory(prefs, { query: query, childId: activeChild.id, childLabel: activeChild.label, groupTitle: activeGroup }));
      }
      renderMain();
      return;
    }
    if (t.getAttribute("data-back")) {
      selected = null;
      renderMain();
      return;
    }
    if (t.getAttribute("data-bm-toggle") && selected && activeChild) {
      persist(V.toggleBookmark(prefs, selected, activeChild.type));
      renderSidebar();
      renderMain();
      return;
    }
    if (t.getAttribute("data-print")) {
      window.print();
      return;
    }
    if (t.getAttribute("data-ai-send")) {
      sendAi();
      return;
    }
    if (t.getAttribute("data-qchip")) {
      el("vb-ai-in").value = t.getAttribute("data-qchip");
      el("vb-ai-in").focus();
    }
  });

  el("vb-ai-in").addEventListener("keydown", function (e) {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendAi();
    }
  });

  renderSidebar();
  renderMain();
  renderAi();
  renderChrome();
})();

</script>
</body>
</html>
